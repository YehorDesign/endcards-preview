    if (!bgOn) return;
    var ctx = bg.getContext("2d");
    if (bg.width !== innerWidth || bg.height !== innerHeight) { bg.width = innerWidth; bg.height = innerHeight; }
    ctx.filter = "blur(28px)";
    // cover-математика: заполняем экран кадром с обрезкой
    var vw = v.videoWidth || 9, vh = v.videoHeight || 16;
    var s = Math.max(bg.width / vw, bg.height / vh) * 1.1; // 1.1 — прячем светлые края блюра
    var w = vw * s, h = vh * s;
    ctx.drawImage(v, (bg.width - w) / 2, (bg.height - h) / 2, w, h);
    requestAnimationFrame(drawBg);
  }
  function syncBg(){
    var want = matchMedia("(orientation: landscape)").matches;
    if (want && !bgOn) { bgOn = true; requestAnimationFrame(drawBg); }
    if (!want) bgOn = false;
  }
  addEventListener("resize", syncBg);
  syncBg();

  // никаких click-хендлеров: тап проходит насквозь к обёртке сети

  function tryPlay(){
    var p = v.play();
    if (p && p.catch) p.catch(function(){
      tap.style.display = "flex";
      tap.addEventListener("click", function(){ tap.style.display="none"; v.play(); }, { once:true });
    });
  }
  // iOS может отбить play() до загрузки данных — повторяем, когда кадры готовы
  v.addEventListener("loadeddata", function(){ if (v.paused) tryPlay(); });
  // MRAID: не стартуем, пока контейнер не готов и карта не видима
  function start(){
    try {
      if (typeof mraid !== "undefined") {
        if (mraid.isViewable && !mraid.isViewable()) {
          mraid.addEventListener("viewableChange", function(vis){ if (vis) tryPlay(); });
          return;
        }
      }
    } catch(e){}
    tryPlay();
  }
  try {
    if (typeof mraid !== "undefined" && mraid.getState && mraid.getState() === "loading")
      mraid.addEventListener("ready", start);
    else start();
  } catch(e){ start(); }
})();
</script>
</body>
